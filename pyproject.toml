[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "PriceListHandler"
version = "1.0.0"
description = "Локальные заказы ХИМБЭСТ с проверяемым точечным экспортом XLSX"
requires-python = ">=3.12"
dependencies = ["PySide6==6.10.1", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "openpyxl>=3.1,<4", "pyinstaller>=6.16,<7"]

[project.scripts]
pricelisthandler = "pricelisthandler.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
