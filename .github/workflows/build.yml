name: Test, build and release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime libraries
        timeout-minutes: 3
        shell: bash
        run: |
          if python -c "import ctypes; [ctypes.CDLL(name) for name in ('libEGL.so.1','libOpenGL.so.0','libxkbcommon.so.0')]"; then
            echo 'Qt runtime libraries are already available'
          else
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libegl1 libopengl0 libxkbcommon0
          fi
      - run: python -m pip install -e '.[dev]'
      - name: Tests and UI checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-results
          path: test-results.xml

  windows:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -e '.[dev]'
      - name: Windows tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --junitxml=windows-tests.xml
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build standalone packages
        run: python scripts/build_windows.py
      - name: Test frozen portable in a Cyrillic path with spaces
        shell: pwsh
        run: |
          $package = Get-ChildItem release/*Portable-x64.zip | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'Проверка программы portable'
          Expand-Archive $package.FullName -DestinationPath $target
          $exe = Join-Path $target 'PriceListHandler\PriceListHandler.exe'
          $out = Join-Path $env:RUNNER_TEMP 'portable-smoke'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "`"$out`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content "$out\failure.txt" -ErrorAction SilentlyContinue; throw "Portable smoke failed: $($process.ExitCode)" }
          $report = Get-Content "$out\smoke.json" -Raw | ConvertFrom-Json
          $expectedData = Join-Path (Split-Path $exe) 'Data'
          if ($report.qt_platform -ne 'windows' -or !$report.latin_cyrillic_font_verified -or $report.default_data_directory -ne $expectedData) { throw 'Native rendering or portable data location failed' }
          Copy-Item "$out\smoke.json" release/portable-smoke.json
          Copy-Item "$out\window.png" release/portable-window.png
      - name: Test installer, installed EXE and uninstaller
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/*Setup-x64.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'Установленная программа с пробелами'
          $process = Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (Test-Path "$target\portable.flag") { throw 'Installed package contains portable marker' }
          $exe = Join-Path $target 'PriceListHandler.exe'
          $out = Join-Path $env:RUNNER_TEMP 'installed-smoke'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "`"$out`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content "$out\failure.txt" -ErrorAction SilentlyContinue; throw "Installed smoke failed: $($process.ExitCode)" }
          $report = Get-Content "$out\smoke.json" -Raw | ConvertFrom-Json
          $expectedData = Join-Path $env:LOCALAPPDATA 'PriceListHandler'
          if ($report.qt_platform -ne 'windows' -or !$report.latin_cyrillic_font_verified -or $report.default_data_directory -ne $expectedData) { throw 'Native rendering or installed data location failed' }
          Copy-Item "$out\smoke.json" release/installed-smoke.json
          Copy-Item "$out\window.png" release/installed-window.png
          $sentinel = Join-Path $env:LOCALAPPDATA 'PriceListHandler\uninstall-data-check.txt'
          New-Item (Split-Path $sentinel) -ItemType Directory -Force | Out-Null
          Set-Content $sentinel 'User data must survive uninstall'
          $uninstaller = Get-ChildItem "$target\unins*.exe" | Select-Object -First 1
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $sentinel)) { throw 'Uninstall failed or user data removed' }
          Remove-Item $sentinel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PriceListHandler-Windows-x64
          path: |
            release/*
            windows-tests.xml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PriceListHandler-Windows-x64
          path: artifacts
      - name: Publish checked release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/release/* --repo "$GITHUB_REPOSITORY" --title "PriceListHandler $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --verify-tag

  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[candidate]')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PriceListHandler-Windows-x64
          path: artifacts
      - name: Publish preliminary build for user acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.0.0-rc.2 artifacts/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PriceListHandler v1.0.0-rc.2 — предварительный выпуск" --notes-file docs/RELEASE_NOTES.md --prerelease
